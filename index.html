<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Teleprompter</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Teleprompter">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
  :root {
    color-scheme: dark;
    --accent: #ffd60a;
    --rec: #ff3b30;
    --fg: #ffffff;
    --dim: rgba(255, 255, 255, 0.65);
    --panel: rgba(28, 28, 32, 0.92);
    --chip: rgba(40, 40, 46, 0.4);
    --line: rgba(255, 255, 255, 0.14);
    --font-size: 34px;
    --prompter-h: 45;
    --prompter-bg: 0.45;
    --guide: 30%;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  #stage { position: fixed; inset: 0; background: #000; }
  #preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #preview.mirrored { transform: scaleX(-1); }

  /* ---------- Prompter overlay ---------- */
  #prompter {
    position: absolute; top: 0; left: 0; right: 0;
    height: calc(var(--prompter-h) * 1dvh);
    min-height: 140px;
    background: linear-gradient(to bottom,
      rgba(0, 0, 0, var(--prompter-bg)) 0%,
      rgba(0, 0, 0, var(--prompter-bg)) 72%,
      rgba(0, 0, 0, 0) 100%);
    touch-action: none; overflow: hidden;
  }
  #textMask {
    position: absolute; inset: var(--safe-t) 0 0 0; overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 70%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 70%, transparent 100%);
  }
  #script {
    position: absolute; top: var(--guide); left: 0; right: 0;
    padding: 0 max(22px, var(--safe-r)) 0 max(22px, var(--safe-l));
    margin-top: calc(var(--font-size) * -0.65);
    font-size: var(--font-size); line-height: 1.3; font-weight: 600;
    text-align: center; white-space: pre-wrap; overflow-wrap: break-word;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 12px rgba(0, 0, 0, 0.6);
    will-change: transform;
  }
  .guide {
    position: absolute; top: calc(var(--safe-t) + (100% - var(--safe-t)) * 0.30);
    width: 0; height: 0; border: 7px solid transparent; margin-top: -7px; opacity: 0.9;
  }
  .guide.l { left: max(4px, var(--safe-l)); border-left-color: var(--accent); }
  .guide.r { right: max(4px, var(--safe-r)); border-right-color: var(--accent); }
  #stage.no-prompter #prompter { display: none; }

  /* ---------- Bottom controls ---------- */
  #controls {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 36px max(16px, var(--safe-r)) calc(14px + var(--safe-b)) max(16px, var(--safe-l));
    background: linear-gradient(to top, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0));
    display: flex; flex-direction: column; gap: 14px; align-items: center;
  }
  /* Controls are see-through so more of the picture stays visible. */
  #timer, .transport, .side, #recBtn { opacity: 0.8; }
  #timer {
    display: flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px;
    background: var(--chip); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px;
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  #timer::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--rec); animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }

  .transport {
    display: flex; align-items: center; gap: 6px; padding: 5px; border-radius: 999px;
    background: var(--chip); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  .transport button {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  }
  .transport button:active { background: rgba(255, 255, 255, 0.16); }
  #playBtn { background: var(--accent); color: #000; }
  #playBtn:active { background: #e6c109; }
  #speedLabel { min-width: 78px; text-align: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #speedLabel small { color: var(--dim); font-weight: 500; font-size: 12px; }
  svg { width: 22px; height: 22px; fill: currentColor; display: block; }

  .mainrow { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; max-width: 420px; }
  .side {
    justify-self: center; display: flex; flex-direction: column; align-items: center; gap: 4px;
    min-width: 64px; padding: 8px; border-radius: 14px; font-size: 12px; font-weight: 600;
  }
  .side:active { background: rgba(255, 255, 255, 0.14); }
  .side:disabled { opacity: 0.3; }
  #recBtn {
    width: 74px; height: 74px; border-radius: 50%; border: 4px solid #fff; display: grid; place-items: center;
  }
  #recBtn i { display: block; width: 56px; height: 56px; border-radius: 50%; background: var(--rec); transition: all 0.2s ease; }
  #recBtn.on i { width: 28px; height: 28px; border-radius: 7px; }
  #recBtn:disabled { opacity: 0.4; }

  /* Phone held sideways: one row along the bottom, record in the middle. */
  @media (orientation: landscape) and (max-height: 540px) {
    #controls {
      display: grid; grid-template-columns: auto 1fr auto 1fr auto; gap: 14px;
      padding-top: 8px; padding-bottom: calc(6px + var(--safe-b)); background: none;
    }
    .mainrow { display: contents; }
    #scriptBtn { grid-area: 1 / 1; }
    #timer { grid-area: 1 / 2; justify-self: end; }
    #recBtn { grid-area: 1 / 3; width: 62px; height: 62px; }
    #recBtn i { width: 46px; height: 46px; }
    #recBtn.on i { width: 24px; height: 24px; }
    .transport { grid-area: 1 / 4; justify-self: start; }
    #settingsBtn { grid-area: 1 / 5; }
  }

  /* ---------- Countdown ---------- */
  #countdown {
    position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0, 0, 0, 0.35);
    font-size: 38vmin; font-weight: 800; font-variant-numeric: tabular-nums; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.7);
  }
  #countdown span { animation: pop 1s ease-out infinite; }
  @keyframes pop { 0% { transform: scale(1.25); opacity: 0.3; } 25% { transform: scale(1); opacity: 1; } 100% { opacity: 0.85; } }

  /* ---------- Notice (camera errors) ---------- */
  #notice {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    padding: 24px max(24px, var(--safe-r)) 24px max(24px, var(--safe-l)); background: #0b0b0d;
  }
  #notice div { max-width: 340px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  #notice h1 { font-size: 22px; margin: 0; }
  #notice p { margin: 0; color: var(--dim); font-size: 15px; line-height: 1.45; }

  .btn {
    padding: 13px 20px; border-radius: 12px; background: rgba(255, 255, 255, 0.14);
    font-weight: 600; font-size: 16px; min-height: 48px;
  }
  .btn.primary { background: var(--accent); color: #000; }
  .btn.danger { color: #ff6961; }
  .btn:active { opacity: 0.75; }

  /* ---------- Sheets ---------- */
  .sheet {
    position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end;
    background: rgba(0, 0, 0, 0.45);
  }
  .sheet .panel {
    background: var(--panel); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
    border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 16px;
    padding: 16px max(18px, var(--safe-r)) calc(18px + var(--safe-b)) max(18px, var(--safe-l));
    max-height: calc(100dvh - var(--safe-t) - 12px); overflow-y: auto;
  }
  .sheet.full .panel { height: calc(100dvh - var(--safe-t) - 12px); }
  .sheet header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .sheet h2 { margin: 0; font-size: 19px; }
  .sheet header button { color: var(--accent); font-weight: 700; font-size: 17px; padding: 8px 4px; }
  #scriptInput {
    flex: 1; min-height: 120px; width: 100%; resize: none; border-radius: 12px; border: 1px solid var(--line);
    background: rgba(0, 0, 0, 0.35); color: var(--fg); padding: 14px; font: inherit; font-size: 17px; line-height: 1.45;
    -webkit-user-select: text; user-select: text;
  }
  .meta { color: var(--dim); font-size: 14px; font-variant-numeric: tabular-nums; }
  .row-btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .row-btns .btn { flex: 1; }

  .field { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; font-size: 16px; }
  .field output { color: var(--dim); font-variant-numeric: tabular-nums; }
  .field input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); height: 30px; }
  .field select {
    font: inherit; font-size: 16px; color: var(--fg); background: rgba(255, 255, 255, 0.12);
    border: 0; border-radius: 9px; padding: 8px 10px;
  }
  #reviewVideo { width: 100%; max-height: 55dvh; border-radius: 12px; background: #000; }
  @media (prefers-reduced-motion: reduce) { #countdown span, #timer::before { animation: none; } }
</style>
</head>
<body>
<div id="stage">
  <video id="preview" class="mirrored" playsinline autoplay muted></video>

  <div id="prompter" aria-label="Script. Tap to play or pause, drag to move.">
    <div id="textMask"><div id="script"></div></div>
    <span class="guide l"></span><span class="guide r"></span>
  </div>

  <div id="controls">
    <div id="timer" hidden>0:00</div>
    <div class="transport">
      <button id="restartBtn" aria-label="Back to start"><svg viewBox="0 0 24 24"><path d="M12 5V1.5L7 6l5 4.5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg></button>
      <button id="slowerBtn" aria-label="Slower"><svg viewBox="0 0 24 24"><path d="M5 11h14v2H5z"/></svg></button>
      <div id="speedLabel">140 <small>wpm</small></div>
      <button id="fasterBtn" aria-label="Faster"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
      <button id="playBtn" aria-label="Start scrolling"><svg viewBox="0 0 24 24"><path id="playIcon" d="M8 5v14l11-7z"/></svg></button>
    </div>
    <div class="mainrow">
      <button class="side" id="scriptBtn"><svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 4h16v2H4zm0 4h10v2H4zm0 4h10v2H4zm13.5-3.5 3 3-4 4H14v-2.5z"/></svg>Script</button>
      <button id="recBtn" aria-label="Start recording" disabled><i></i></button>
      <button class="side" id="settingsBtn"><svg viewBox="0 0 24 24"><path d="M3 6h10v2H3zm14 0h4v2h-4zm-3-2h2v6h-2zM3 16h4v2H3zm8 0h10v2H11zm-3-2h2v6H8z"/></svg>Settings</button>
    </div>
  </div>

  <div id="countdown" hidden><span></span></div>

  <div id="notice" hidden>
    <div>
      <h1 id="noticeTitle">Camera access needed</h1>
      <p id="noticeText"></p>
      <button class="btn primary" id="retryBtn">Try again</button>
    </div>
  </div>

  <div class="sheet full" id="scriptSheet" hidden>
    <div class="panel">
      <header><h2>Script</h2><button id="scriptDone">Done</button></header>
      <textarea id="scriptInput" placeholder="Type or paste your script here…" autocapitalize="sentences"></textarea>
      <div class="meta" id="scriptMeta"></div>
      <div class="row-btns">
        <button class="btn" id="pasteBtn">Paste</button>
        <button class="btn danger" id="clearBtn">Clear</button>
      </div>
    </div>
  </div>

  <div class="sheet" id="settingsSheet" hidden>
    <div class="panel">
      <header><h2>Settings</h2><button id="settingsDone">Done</button></header>
      <label class="field">Text size <output id="fontOut"></output>
        <input type="range" id="fontRange" min="20" max="80" step="1"></label>
      <label class="field">Speed <output id="wpmOut"></output>
        <input type="range" id="wpmRange" min="60" max="260" step="5"></label>
      <label class="field">Prompter height <output id="heightOut"></output>
        <input type="range" id="heightRange" min="25" max="80" step="1"></label>
      <label class="field">Background dim <output id="bgOut"></output>
        <input type="range" id="bgRange" min="0" max="90" step="5"></label>
      <label class="field">Countdown before recording
        <select id="countdownSel"><option value="0">None</option><option value="3">3 seconds</option><option value="5">5 seconds</option><option value="10">10 seconds</option></select></label>
      <label class="field">Camera
        <select id="cameraSel"><option value="user">Front</option><option value="environment">Back</option></select></label>
      <label class="field">Video quality
        <select id="qualitySel"><option value="1080">1080p</option><option value="720">720p</option><option value="2160">4K (if supported)</option></select></label>
    </div>
  </div>

  <div class="sheet" id="reviewSheet" hidden>
    <div class="panel">
      <header><h2>Your take</h2><span class="meta" id="reviewMeta"></span></header>
      <video id="reviewVideo" playsinline controls></video>
      <div class="row-btns">
        <button class="btn primary" id="saveBtn">Save video</button>
        <button class="btn danger" id="discardBtn">Discard</button>
      </div>
      <a id="downloadLink" class="meta" hidden>Download file instead</a>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;

  // ---------- Persistent state ----------
  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
      catch { return fallback; }
    },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
  };

  const SAMPLE = `Welcome to your teleprompter.

Tap Script below to replace this text with your own.

When you hit the red button, a countdown starts, then the camera records and this text begins to scroll.

The words stay close to the camera lens, so your eyes look straight at your audience.

Only you can see the script. It is never part of the video.

Tap the text to pause or resume. Drag it to move back or ahead.

Use plus and minus to match your natural speaking pace.

When you are done, press stop and save the video to your Photos.`;

  const settings = Object.assign(
    { font: 34, wpm: 140, height: 45, bg: 45, countdown: 3, camera: 'user', quality: 1080 },
    store.get('tp.settings', {}),
  );
  let scriptText = store.get('tp.script', SAMPLE);

  // ---------- Elements ----------
  const stage = $('stage'), preview = $('preview'), prompter = $('prompter'), scriptEl = $('script');
  const recBtn = $('recBtn'), playBtn = $('playBtn'), playIcon = $('playIcon'), timerEl = $('timer');
  const PLAY = 'M8 5v14l11-7z', PAUSE = 'M6 5h4v14H6zm8 0h4v14h-4z';

  // ---------- Scrolling ----------
  let offset = 0, maxOffset = 0, pxPerSec = 0, playing = false, lastT = 0, rafId = 0;

  const wordCount = (t) => (t.trim().match(/\S+/g) || []).length;
  const fmtTime = (s) => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  function render() { scriptEl.style.transform = `translate3d(0, ${-offset}px, 0)`; }

  function measure() {
    maxOffset = scriptEl.offsetHeight;
    const words = wordCount(scriptText);
    // Scroll speed is derived from reading pace, so text size never changes how fast you must talk.
    pxPerSec = words ? maxOffset / (words / settings.wpm * 60) : 0;
    offset = Math.min(offset, maxOffset);
    render();
  }

  function tick(t) {
    if (!playing) return;
    const dt = Math.min(0.1, (t - lastT) / 1000);
    lastT = t;
    offset += pxPerSec * dt;
    if (offset >= maxOffset) { offset = maxOffset; render(); setPlaying(false); return; }
    render();
    rafId = requestAnimationFrame(tick);
  }

  function setPlaying(on) {
    if (on && offset >= maxOffset) offset = 0;
    playing = on && pxPerSec > 0;
    cancelAnimationFrame(rafId);
    playIcon.setAttribute('d', playing ? PAUSE : PLAY);
    playBtn.setAttribute('aria-label', playing ? 'Pause scrolling' : 'Start scrolling');
    if (playing) { lastT = performance.now(); rafId = requestAnimationFrame(tick); }
  }

  function setScript(text) {
    scriptText = text;
    scriptEl.textContent = text.trim() ? text : 'Tap Script to add your text.';
    store.set('tp.script', text);
    measure();
  }

  // Tap the text to play/pause; drag it to move through the script.
  let drag = null;
  prompter.addEventListener('pointerdown', (e) => {
    drag = { y: e.clientY, start: offset, moved: false };
    prompter.setPointerCapture(e.pointerId);
  });
  prompter.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dy = e.clientY - drag.y;
    if (Math.abs(dy) > 8) drag.moved = true;
    if (drag.moved) { offset = Math.max(0, Math.min(maxOffset, drag.start - dy)); render(); }
  });
  const endDrag = (e) => {
    if (!drag) return;
    if (!drag.moved && e.type === 'pointerup') setPlaying(!playing);
    drag = null;
  };
  prompter.addEventListener('pointerup', endDrag);
  prompter.addEventListener('pointercancel', endDrag);

  // ---------- Settings ----------
  function applySettings() {
    root.style.setProperty('--font-size', settings.font + 'px');
    root.style.setProperty('--prompter-h', settings.height);
    root.style.setProperty('--prompter-bg', settings.bg / 100);
    $('fontRange').value = settings.font;     $('fontOut').textContent = settings.font + ' px';
    $('wpmRange').value = settings.wpm;       $('wpmOut').textContent = settings.wpm + ' words/min';
    $('heightRange').value = settings.height; $('heightOut').textContent = settings.height + '%';
    $('bgRange').value = settings.bg;         $('bgOut').textContent = settings.bg + '%';
    $('countdownSel').value = settings.countdown;
    $('cameraSel').value = settings.camera;
    $('qualitySel').value = settings.quality;
    $('speedLabel').innerHTML = settings.wpm + ' <small>wpm</small>';
    preview.classList.toggle('mirrored', settings.camera === 'user');
    store.set('tp.settings', settings);
    measure();
  }
  const bindRange = (id, key) => $(id).addEventListener('input', (e) => { settings[key] = +e.target.value; applySettings(); });
  bindRange('fontRange', 'font'); bindRange('wpmRange', 'wpm'); bindRange('heightRange', 'height'); bindRange('bgRange', 'bg');
  $('countdownSel').addEventListener('change', (e) => { settings.countdown = +e.target.value; applySettings(); });
  $('cameraSel').addEventListener('change', (e) => { settings.camera = e.target.value; applySettings(); startCamera(); });
  $('qualitySel').addEventListener('change', (e) => { settings.quality = +e.target.value; applySettings(); startCamera(); });

  const nudgeSpeed = (d) => { settings.wpm = Math.max(60, Math.min(260, settings.wpm + d)); applySettings(); };
  $('slowerBtn').addEventListener('click', () => nudgeSpeed(-10));
  $('fasterBtn').addEventListener('click', () => nudgeSpeed(10));
  $('restartBtn').addEventListener('click', () => { offset = 0; render(); });
  playBtn.addEventListener('click', () => setPlaying(!playing));

  // ---------- Sheets ----------
  const openSheet = (id) => { $(id).hidden = false; };
  const closeSheet = (id) => { $(id).hidden = true; };
  for (const id of ['scriptSheet', 'settingsSheet']) {
    $(id).addEventListener('click', (e) => { if (e.target === $(id)) $(id === 'scriptSheet' ? 'scriptDone' : 'settingsDone').click(); });
  }
  const updateMeta = () => {
    const w = wordCount($('scriptInput').value);
    $('scriptMeta').textContent = `${w} word${w === 1 ? '' : 's'} · about ${fmtTime(w / settings.wpm * 60)} at ${settings.wpm} wpm`;
  };
  $('scriptBtn').addEventListener('click', () => {
    setPlaying(false);
    $('scriptInput').value = scriptText;
    updateMeta();
    $('pasteBtn').hidden = !(navigator.clipboard && navigator.clipboard.readText);
    openSheet('scriptSheet');
  });
  $('scriptInput').addEventListener('input', updateMeta);
  $('scriptDone').addEventListener('click', () => {
    const changed = $('scriptInput').value !== scriptText;
    closeSheet('scriptSheet');
    if (changed) { offset = 0; setScript($('scriptInput').value); }
  });
  $('pasteBtn').addEventListener('click', async () => {
    try {
      const t = await navigator.clipboard.readText();
      if (t) { const el = $('scriptInput'); el.value = el.value ? el.value + '\n\n' + t : t; updateMeta(); }
    } catch {}
  });
  let clearArmed = 0;
  $('clearBtn').addEventListener('click', () => {
    if (Date.now() - clearArmed < 3000) { $('scriptInput').value = ''; updateMeta(); $('clearBtn').textContent = 'Clear'; clearArmed = 0; }
    else {
      clearArmed = Date.now(); $('clearBtn').textContent = 'Tap again to clear';
      setTimeout(() => { if (clearArmed) { $('clearBtn').textContent = 'Clear'; clearArmed = 0; } }, 3000);
    }
  });
  $('settingsBtn').addEventListener('click', () => openSheet('settingsSheet'));
  $('settingsDone').addEventListener('click', () => closeSheet('settingsSheet'));

  // ---------- Camera ----------
  let stream = null, cameraBusy = false;

  function showNotice(title, text) {
    $('noticeTitle').textContent = title; $('noticeText').textContent = text; $('notice').hidden = false;
    recBtn.disabled = true;
  }

  function stopStream() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null; preview.srcObject = null;
  }

  async function startCamera() {
    if (cameraBusy || recorder) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showNotice('Camera unavailable', window.isSecureContext
        ? 'This browser does not support camera recording. On iPhone, open this page in Safari.'
        : 'The camera only works on a secure (https) page. Open the https address of this app.');
      return;
    }
    cameraBusy = true;
    stopStream();
    const long = settings.quality === 2160 ? 3840 : settings.quality === 720 ? 1280 : 1920;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: settings.camera, width: { ideal: long }, height: { ideal: long * 9 / 16 }, frameRate: { ideal: 30 } },
        audio: { echoCancellation: true, noiseSuppression: true },
      });
      preview.srcObject = stream;
      preview.play().catch(() => {});
      $('notice').hidden = true;
      recBtn.disabled = typeof MediaRecorder === 'undefined';
      if (recBtn.disabled) showNotice('Recording unavailable', 'This browser cannot record video. Update iOS (14.3 or later) and use Safari.');
    } catch (err) {
      const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
      showNotice(denied ? 'Camera access needed' : 'Could not start the camera',
        denied
          ? 'Allow camera and microphone access to record. On iPhone: tap the “aA” or page-settings button in Safari’s address bar, choose Website Settings, and set Camera and Microphone to Allow.'
          : 'Another app may be using the camera. Close it and try again. (' + (err && err.name || 'error') + ')');
    } finally { cameraBusy = false; }
  }
  $('retryBtn').addEventListener('click', startCamera);

  // ---------- Keep the screen awake ----------
  let wakeLock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } }
    catch {}
  }

  // ---------- Recording ----------
  let recorder = null, chunks = [], recStart = 0, timerInt = 0, countdownInt = 0, take = null;

  function pickMime() {
    const types = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    return types.find((t) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
  }

  function setRecUI(state) { // 'idle' | 'countdown' | 'recording'
    recBtn.classList.toggle('on', state !== 'idle');
    recBtn.setAttribute('aria-label', state === 'idle' ? 'Start recording' : state === 'countdown' ? 'Cancel countdown' : 'Stop recording');
    $('scriptBtn').disabled = $('settingsBtn').disabled = state !== 'idle';
    timerEl.hidden = state !== 'recording';
    $('countdown').hidden = state !== 'countdown';
  }

  function beginCountdown() {
    let n = settings.countdown;
    setPlaying(false);
    if (offset >= maxOffset) { offset = 0; render(); }
    if (!n) return beginRecording();
    setRecUI('countdown');
    const label = $('countdown').firstElementChild;
    label.textContent = n;
    countdownInt = setInterval(() => {
      n -= 1;
      if (n <= 0) { clearInterval(countdownInt); countdownInt = 0; beginRecording(); }
      else label.textContent = n;
    }, 1000);
  }

  function beginRecording() {
    if (!stream || !stream.active) { setRecUI('idle'); startCamera(); return; }
    const mimeType = pickMime();
    const bits = settings.quality === 2160 ? 24e6 : settings.quality === 720 ? 5e6 : 10e6;
    try { recorder = new MediaRecorder(stream, Object.assign({ videoBitsPerSecond: bits }, mimeType ? { mimeType } : {})); }
    catch { recorder = new MediaRecorder(stream); }
    chunks = [];
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = finishRecording;
    recorder.onerror = () => stopRecording();
    recorder.start(1000);
    recStart = performance.now();
    timerEl.textContent = '0:00';
    timerInt = setInterval(() => { timerEl.textContent = fmtTime((performance.now() - recStart) / 1000); }, 250);
    setRecUI('recording');
    keepAwake();
    setPlaying(true);
  }

  function stopRecording() {
    if (recorder && recorder.state !== 'inactive') recorder.stop();
  }

  function finishRecording() {
    clearInterval(timerInt);
    setPlaying(false);
    const type = (recorder.mimeType || (chunks[0] && chunks[0].type) || 'video/mp4').split(';')[0];
    const seconds = (performance.now() - recStart) / 1000;
    recorder = null;
    setRecUI('idle');
    const blob = new Blob(chunks, { type });
    chunks = [];
    if (!blob.size) return;
    const d = new Date(), p = (n) => String(n).padStart(2, '0');
    const name = `teleprompter-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${type.includes('mp4') ? 'mp4' : 'webm'}`;
    take = { file: new File([blob], name, { type }), url: URL.createObjectURL(blob) };
    $('reviewVideo').src = take.url;
    $('reviewMeta').textContent = `${fmtTime(seconds)} · ${(blob.size / 1048576).toFixed(1)} MB`;
    const link = $('downloadLink'); link.href = take.url; link.download = name;
    link.hidden = !(navigator.canShare && navigator.canShare({ files: [take.file] }));
    $('saveBtn').textContent = 'Save video';
    openSheet('reviewSheet');
  }

  recBtn.addEventListener('click', () => {
    if (countdownInt) { clearInterval(countdownInt); countdownInt = 0; setRecUI('idle'); }
    else if (recorder) stopRecording();
    else beginCountdown();
  });

  // Save: the iOS share sheet offers "Save Video", which puts the take in Photos.
  $('saveBtn').addEventListener('click', async () => {
    if (!take) return;
    if (navigator.canShare && navigator.canShare({ files: [take.file] })) {
      try { await navigator.share({ files: [take.file] }); $('saveBtn').textContent = 'Save again'; }
      catch (e) { if (e && e.name !== 'AbortError') $('downloadLink').hidden = false; }
    } else {
      const a = document.createElement('a'); a.href = take.url; a.download = take.file.name;
      document.body.appendChild(a); a.click(); a.remove();
    }
  });
  let discardArmed = 0;
  $('discardBtn').addEventListener('click', () => {
    if (Date.now() - discardArmed < 3000 || $('saveBtn').textContent === 'Save again') {
      $('reviewVideo').pause(); $('reviewVideo').removeAttribute('src'); $('reviewVideo').load();
      if (take) URL.revokeObjectURL(take.url);
      take = null; discardArmed = 0; $('discardBtn').textContent = 'Discard';
      closeSheet('reviewSheet');
    } else {
      discardArmed = Date.now(); $('discardBtn').textContent = 'Tap again to discard';
      setTimeout(() => { if (discardArmed) { $('discardBtn').textContent = 'Discard'; discardArmed = 0; } }, 3000);
    }
  });
  // "Discard" becomes "Done" wording once saved.
  new MutationObserver(() => { $('discardBtn').textContent = $('saveBtn').textContent === 'Save again' ? 'Done' : 'Discard'; })
    .observe($('saveBtn'), { childList: true });

  // ---------- Lifecycle ----------
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      // iOS cuts the camera in the background: end the take cleanly so it is not lost.
      if (countdownInt) { clearInterval(countdownInt); countdownInt = 0; setRecUI('idle'); }
      stopRecording();
      setPlaying(false);
    } else {
      keepAwake();
      const live = stream && stream.getVideoTracks().some((t) => t.readyState === 'live' && !t.muted);
      if (!live) startCamera();
    }
  });
  window.addEventListener('resize', measure);
  window.addEventListener('orientationchange', () => setTimeout(measure, 300));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

  // Keyboard / Bluetooth remote: space = play/pause, arrows = speed, R = record.
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('textarea, input, select')) return;
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    else if (e.code === 'ArrowUp' || e.code === 'ArrowRight') nudgeSpeed(10);
    else if (e.code === 'ArrowDown' || e.code === 'ArrowLeft') nudgeSpeed(-10);
    else if (e.key === 'r' || e.key === 'R') recBtn.click();
  });

  // ---------- Boot ----------
  setScript(scriptText);
  applySettings();
  setRecUI('idle');
  startCamera();
  keepAwake();
  document.addEventListener('pointerdown', keepAwake, { once: true });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
